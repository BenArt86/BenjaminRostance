<main>
    <h2>Contact</h2>

    <p>If you’d like to get in touch about commissions, sales, or collaboration, you can send me a message using the form below.</p>

    <form action="https://formspree.io/f/moeqbzpb" method="POST">
        
        <label for="name">Name</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="message">Message</label><br>
        <textarea id="message" name="message" rows="6" required></textarea><br><br>

        <button type="submit">Send Message</button>
    </form>

    <p>You can also follow my work on Instagram: 
        <a href="https://instagram.com/BenArt86" target="_blank">@BenArt86</a>
    </p>
